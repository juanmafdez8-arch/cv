name: Publicar CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar web (descomprime el zip si existe)
        run: |
          mkdir -p _site
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _tmp
            unzip -o -q "$ZIP" -d _tmp
            SRC=$(dirname "$(find _tmp -name index.html | head -1)")
          else
            SRC=.
          fi
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_tmp' --exclude '*.zip' "$SRC"/ _site/
          echo "juanmafernandez.net" > _site/CNAME
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
